<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>CHOICE SLATS VIET NAM</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #fff;
}

body {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    overflow-x: hidden;
    padding: 24px 16px 48px;
}

.scene {
    width: min(790px, 100vw);
    aspect-ratio: 790 / 434;
    position: relative;
}

svg {
    display: block;
    width: 100%;
    height: 100%;
}

/* =========================================================
   字体
   原版不是 Impact 那种超粗字体。
   使用较规整、偏窄的无衬线字体。
========================================================= */

.choice {
    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-weight: 600;

    letter-spacing: -1.2px;
}

.vietnam {
    font-family:
        "Arial",
        "Helvetica Neue",
        sans-serif;

    font-weight: 700;
    letter-spacing: 8px;
}

/* =========================================================
   三语应用名称
========================================================= */
.app-title-wrap {
    width: 100%;
    max-width: 790px;
    margin-top: 12px;
    text-align: center;
}

.app-title {
    font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(22px, 5vw, 40px);
    font-weight: 700;
    color: #17263d;
    letter-spacing: 1px;
    line-height: 1.2;
}

.app-sub {
    font-family: Arial, "Helvetica Neue", sans-serif;
    font-size: clamp(13px, 3vw, 18px);
    color: #555;
    margin-top: 8px;
    letter-spacing: 0.5px;
}

.app-hint {
    font-family: Arial, "Helvetica Neue", sans-serif;
    font-size: 13px;
    color: #999;
    margin-top: 32px;
}
</style>
</head>

<body>

<div class="scene">

</svg>

</div>

<div class="app-title-wrap">
    <div id="appTitle" class="app-title">CHOICE VIETNAM MANAGEMENT</div>
    <div id="appSub" class="app-sub">单机版 / Standalone / Phiên bản độc lập</div>
</div>

<div class="app-hint" id="versionHint">v —</div>

<script>
(function(){
    var I18N = {
        en: {
            title: "CHOICE VIETNAM MANAGEMENT",
            sub: "Standalone Edition"
        },
        zh: {
            title: "越南 CHOICE 管理系统",
            sub: "单机版"
        },
        vi: {
            title: "Hệ thống quản lý CHOICE của Việt Nam",
            sub: "Phiên bản độc lập"
        }
    };

    function applyLang(lang) {
        var t = I18N[lang] || I18N.en;
        document.getElementById("appTitle").textContent = t.title;
        document.getElementById("appSub").textContent = t.sub;
    }

    // 1) 优先读取 Android 原生注入的系统语言
    window.setAppLang = function(lang) {
        applyLang(lang);
    };

    // 2) 兜底：用浏览器/系统语言初始化
    var navLang = (navigator.language || "en").toLowerCase();
    var lang = "en";
    if (navLang.indexOf("zh") === 0) lang = "zh";
    else if (navLang.indexOf("vi") === 0) lang = "vi";
    applyLang(lang);

    // 3) 显示版本（由原生桥提供）
    try {
        if (window.AndroidBridge && window.AndroidBridge.getVersion) {
            document.getElementById("versionHint").textContent = "v " + window.AndroidBridge.getVersion();
        } else {
            document.getElementById("versionHint").textContent = "";
        }
    } catch(e) {
        document.getElementById("versionHint").textContent = "";
    }
})();
</script>

</body>
</html>
