# Choice Viet Nam signing config
# For local build convenience only.
CHOICE_RELEASE_STORE_PASSWORD=choice123
CHOICE_RELEASE_KEY_ALIAS=choice
CHOICE_RELEASE_KEY_PASSWORD=choice123

# Gradle performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (required for androidx.* dependencies)
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
