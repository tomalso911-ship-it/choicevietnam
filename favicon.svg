<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CHOICE SLATS VIET NAM">
  <rect width="64" height="64" fill="#ffffff"/>
  <g transform="translate(0,2)">
    <!-- top face of concrete slab -->
    <path d="M6 18 L58 18 L50 34 L14 34 Z" fill="#f7f7f5" stroke="#c9cac8" stroke-width="1"/>
    <!-- side/front face -->
    <path d="M14 34 L50 34 L50 48 L14 48 Z" fill="#d0d1cf" stroke="#bfc0be" stroke-width="1"/>
    <!-- bottom lip shadow -->
    <path d="M14 48 L50 48 L50 50 L14 50 Z" fill="#bfc0be"/>
    <!-- dark grooves on top face -->
    <g stroke="#17253c" stroke-width="2.2" stroke-linecap="round">
      <line x1="14" y1="20" x2="12" y2="32"/>
      <line x1="24" y1="20" x2="22" y2="32"/>
      <line x1="34" y1="20" x2="32" y2="32"/>
      <line x1="44" y1="20" x2="42" y2="32"/>
      <line x1="54" y1="20" x2="52" y2="32"/>
    </g>
    <!-- front label panel -->
    <rect x="15" y="36" width="34" height="10" rx="2" fill="#ffffff" stroke="#c9cac8" stroke-width="0.5"/>
    <text x="32" y="43.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="8" fill="#D32F2F">CS</text>
  </g>
</svg>
